plugins {
    id 'java-library'
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

dependencies {
    implementation "org.apache.commons:commons-lang3:${apache_commons_lang_version}"
    implementation "org.slf4j:slf4j-api:${slf4j_version}"
    implementation "org.slf4j:slf4j-simple:${slf4j_version}"
    testImplementation "com.google.guava:guava:${guava_version}"
    testImplementation platform("org.junit:junit-bom:5.13.4") // 🔥 aligns all JUnit platform modules
    testImplementation "org.junit.jupiter:junit-jupiter"
    testImplementation "com.squareup.okhttp3:mockwebserver:5.0.0-alpha.14"
    testImplementation "org.mockito:mockito-core:${mockito_version}"
    testImplementation "org.mockito:mockito-junit-jupiter:${mockito_version}"
    testImplementation "org.assertj:assertj-core:${assertj_version}"

    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.13.4"
}


test {
    useJUnitPlatform()
}
